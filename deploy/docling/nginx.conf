# Included inside nginx's http block (sites-enabled on Ubuntu).
limit_conn_zone $server_name zone=papermind_docling_total:1m;

server {
    listen 101.76.222.224:443 ssl;
    server_name 101.76.222.224;

    ssl_certificate /etc/papermind/docling/server.pem;
    ssl_certificate_key /etc/papermind/docling/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;

    # Allow a 64 MiB PDF plus multipart fields without writing uploads to disk.
    client_max_body_size 65m;
    client_body_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 1900s;
    proxy_read_timeout 1900s;
    proxy_request_buffering off;
    proxy_buffering off;

    access_log /var/log/nginx/papermind-docling-access.log;
    error_log /var/log/nginx/papermind-docling-error.log warn;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5001;
    }
    location = /openapi.json {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5001;
    }
    location = /v1/convert/file {
        limit_except POST { deny all; }
        # Across all clients, reject extra active requests rather than exhaust the GPU.
        limit_conn papermind_docling_total 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:5001;
    }
    location / { return 404; }
}
